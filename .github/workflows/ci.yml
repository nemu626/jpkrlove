name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database-contracts:
    name: Supabase database contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.110.0
      - name: Start the local Supabase stack
        run: supabase start
      - name: Reset database from migrations and seed
        run: supabase db reset --local
      - name: Run pgTAP and RPC boundary tests
        run: supabase test db
      - name: Check migrations and database policies
        run: supabase db lint --local
      - name: Stop the local Supabase stack
        if: always()
        run: supabase stop
